name: Validate JSON Data

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Schema validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON syntax and schema
        run: node .github/scripts/validate-json.js

      # Verify the drift checker can still detect drift before trusting its
      # verdict — a checker that silently stopped working would otherwise report
      # green forever, which is worse than having no checker at all.
      - name: Self-test the spec drift checker
        run: node .github/scripts/spec-drift-check.js --self-test

      - name: Check CURRENT-SPEC.md for drift
        run: node .github/scripts/spec-drift-check.js
