name: Notebook-X Mirror Sync

# Weekly pull of the Notebook-X public index + all listed notebooks into
# data/notebooks/ (see CLAUDE.md "AI Backend" + "Automation Workflows").
# Requires a repo secret NOTEBOOKX_READ_TOKEN: a fine-grained GitHub PAT
# scoped to READ-ONLY Contents access on avivnofar/Notebook-X only. Create
# it manually under Settings → Secrets and variables → Actions — this
# workflow never requests or handles the token value itself.

#
# Deliberately NOT checked here: index staleness ("_index-public.json's
# updatedAt is older than N weeks"). Considered and rejected as
# over-engineering, 2026-08-01 — reasoning recorded so it isn't re-litigated:
#   * Every failure mode this sync actually has — missing/expired token,
#     upstream schema change, rate limit, unparseable JSON — already makes
#     sync-notebooks.js exit non-zero, which the failure step below surfaces
#     into NEEDS_YOUR_REVIEW.md. A staleness check adds no coverage there.
#   * The only gap it would cover is "sync succeeds, but Notebook-X itself
#     stopped being updated" — which is not a fault and not this repo's
#     problem. Notebook-X is a personal knowledge base; quiet weeks are
#     normal, expected behaviour.
#   * It would fire on healthy data today: the mirrored index's updatedAt is
#     2026-07-17, already ~2 weeks old with nothing wrong. An alarm that
#     cries wolf on a healthy mirror trains the owner to ignore the same
#     file where real sync failures are reported — it would actively make
#     failure visibility worse, not better.
# Revisit only if a failure mode is ever observed that exits 0 while leaving
# data/notebooks/ stale.
#
on:
  schedule:
    - cron: "0 5 * * 1"   # Every Monday at 05:00 UTC (quiet hour, owner preference)
  workflow_dispatch:        # Allow manual trigger

jobs:
  sync:
    name: Sync data/notebooks/ from Notebook-X
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch + validate Notebook-X mirror
        id: sync
        env:
          NOTEBOOKX_READ_TOKEN: ${{ secrets.NOTEBOOKX_READ_TOKEN }}
        run: node .github/scripts/sync-notebooks.js

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notebooks/
          git diff --cached --quiet || git commit -m "chore: weekly Notebook-X mirror sync"
          git push

      # Silent-failure prevention (CLAUDE.md hard rule): a failed sync must
      # leave a visible trace, not just a red mark in the Actions tab that
      # nobody opens. Runs only when an earlier step failed.
      - name: Report failure into NEEDS_YOUR_REVIEW.md
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- . || true
          git fetch origin master
          git checkout -B master origin/master
          FILE=automation/NEEDS_YOUR_REVIEW.md
          # If an unresolved failure note is already present, do not stack another
          # one — a multi-week outage should leave one live entry, not fifty.
          if grep -q "Notebook-X sync failed" "$FILE"; then
            echo "An unresolved sync-failure note already exists; not duplicating it."
            exit 0
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "## Notebook-X sync failed — \`data/notebooks/\` is stale"
            echo ""
            echo "*(written automatically by \`.github/workflows/notebook-sync.yml\` on $(date -u '+%Y-%m-%d %H:%M UTC'))*"
            echo ""
            echo "The weekly mirror sync failed, so \`data/notebooks/\` was not updated and"
            echo "AI Search is serving whatever was last mirrored successfully. This entry"
            echo "exists so the failure is not silent."
            echo ""
            echo "**Run log:** $RUN_URL"
            echo ""
            echo "**Check first:** the \`NOTEBOOKX_READ_TOKEN\` repo secret — missing,"
            echo "expired, or lacking read-only Contents access on \`avivnofar/Notebook-X\`."
            echo "\`sync-notebooks.js\` exits 1 with an explicit message when it is unset."
            echo ""
            echo "Delete this section by hand once the sync is green again; while it is"
            echo "present, further failures will not add duplicate entries."
          } >> "$FILE"
          git add "$FILE"
          git commit -m "chore: flag Notebook-X sync failure for owner review"
          git push origin master
