name: Generate Changelog

on:
  push:
    branches:
      - main
      - master

jobs:
  changelog:
    name: Prepend commits to CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and prepend changelog entry
        run: |
          PUSH_DATE=$(date -u +"%Y-%m-%d")
          PUSH_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Collect commits in this push (compare to the commit before the push)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # If this is the very first push BEFORE will be all zeros
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git log --pretty=format:"- %s ([%h](https://github.com/$REPO/commit/%H))" "$AFTER" | head -20)
          else
            COMMITS=$(git log --pretty=format:"- %s ([%h](https://github.com/$REPO/commit/%H))" "$BEFORE..$AFTER")
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits to log."
            exit 0
          fi

          # Build the new section
          NEW_SECTION="## [$PUSH_DATE — $PUSH_SHA] ($BRANCH)\n\n$COMMITS\n"

          # Prepend to CHANGELOG.md (create the file with a header if it does not exist)
          if [ ! -f CHANGELOG.md ]; then
            printf "# Changelog\n\nAll changes are auto-generated from commit messages on push to %s.\n\n" "$BRANCH" > CHANGELOG.md
          fi

          # Insert new section right after the first line (the # Changelog header)
          HEADER=$(head -1 CHANGELOG.md)
          REST=$(tail -n +2 CHANGELOG.md)
          printf "%s\n\n%b\n%s" "$HEADER" "$NEW_SECTION" "$REST" > CHANGELOG.md

      - name: Commit updated CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG.md [skip ci]"
          git push
