name: Weekly Data Quality Report

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  health-check:
    name: Data quality report
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Note: the previous version appended an `exit_code` output here. Under the
      # default `bash -e`, a failing node run aborted the block before that line,
      # so the output was never set and nothing ever read it. `steps.health.outcome`
      # is the value the conditions below actually use — same shape as link-check.yml.
      - name: Run data quality check
        id: health
        run: node .github/scripts/health-check.js
        continue-on-error: true

      - name: Post summary to GitHub Actions
        if: always()
        run: |
          echo "### Data Quality Report — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node .github/scripts/health-check.js --summary >> $GITHUB_STEP_SUMMARY

      - name: Open GitHub Issue on critical failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Dedupe guard — same pattern as link-check.yml: if a data-quality
            // issue is already open, don't stack a duplicate on every weekly run.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-quality',
            });
            if (issues.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Health Check] Critical data quality issues found — ${date}`,
              body: [
                '## Weekly Health Check Failed',
                '',
                `The automated data quality check found critical issues on **${date}**.`,
                '',
                `**Workflow run:** [View details](${runUrl})`,
                '',
                '### What to check:',
                '- Entries missing `source_url`',
                '- `source_url` pointing to unapproved/blocked domains',
                '- Hebrew characters in `cmd` fields (commands must be LTR)',
                '- Identical `desc_he` / `desc_en` (copy-paste error)',
                '',
                '### How to fix:',
                '1. Run `node .github/scripts/health-check.js` locally to see the full report',
                '2. Fix the flagged entries in the relevant JSON file',
                '3. Run `node .github/scripts/validate-json.js` to confirm schema is valid',
                '4. Commit and push — this issue will be closed automatically when the next health check passes',
                '',
                '---',
                '_Auto-opened by the weekly health check workflow._',
              ].join('\n'),
              labels: ['data-quality', 'automated'],
            });

      # Auto-close counterpart to the dedupe guard above — without this, the
      # guard alone would suppress the issue forever after the first failure.
      # Mirrors link-check.yml's "Close issue if check passed" step.
      - name: Close issue if check passed
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-quality',
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Resolved — all data quality checks pass again.',
              });
            }
