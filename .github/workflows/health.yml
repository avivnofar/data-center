name: Weekly Data Quality Report

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  health-check:
    name: Data quality report
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run data quality check
        id: health
        run: |
          node .github/scripts/health-check.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post summary to GitHub Actions
        run: |
          echo "### Data Quality Report — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node .github/scripts/health-check.js --summary >> $GITHUB_STEP_SUMMARY

      - name: Open GitHub Issue on critical failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Health Check] Critical data quality issues found — ${date}`,
              body: [
                '## Weekly Health Check Failed',
                '',
                `The automated data quality check found critical issues on **${date}**.`,
                '',
                `**Workflow run:** [View details](${runUrl})`,
                '',
                '### What to check:',
                '- Entries missing `source_url`',
                '- `source_url` pointing to unapproved/blocked domains',
                '- Hebrew characters in `cmd` fields (commands must be LTR)',
                '- Identical `desc_he` / `desc_en` (copy-paste error)',
                '',
                '### How to fix:',
                '1. Run `node .github/scripts/health-check.js` locally to see the full report',
                '2. Fix the flagged entries in the relevant JSON file',
                '3. Run `node .github/scripts/validate-json.js` to confirm schema is valid',
                '4. Commit and push — this issue will be closed automatically when the next health check passes',
                '',
                '---',
                '_Auto-opened by the weekly health check workflow._',
              ].join('\n'),
              labels: ['data-quality', 'automated'],
            });
