name: Scheduled Claude Automation

on:
  schedule:
    # DAY 3 OFFICE: 23:30 UTC = 02:30 Israel time
    - cron: '30 23 * * 0-4'
    # MORNING SESSION: 04:30 UTC = 07:30 Israel time
    - cron: '30 4 * * 0-4'
    # DAILY MAINTENANCE: 18:30 UTC = 21:30 Israel time (token refresh)
    - cron: '30 18 * * 0-4'
  workflow_dispatch:
    inputs:
      task_override:
        description: 'Override task (leave empty to use TOKEN-BUDGET.md queue)'
        required: false

jobs:
  claude-session:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine session type and task
        id: session
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          TASK_OVERRIDE="${{ github.event.inputs.task_override }}"

          # Read next task from TOKEN-BUDGET.md
          NEXT_TASK=$(grep -A1 "⏳ Next" TOKEN-BUDGET.md | tail -1 | sed 's/.*— //')

          if [ -n "$TASK_OVERRIDE" ]; then
            TASK="$TASK_OVERRIDE"
            SESSION_TYPE="manual"
          elif [ "$HOUR" = "23" ]; then
            SESSION_TYPE="office_day_night"
            TASK="Run office Day 3 simulation: agents 1-4 work cases using Groq, emphasis on solving as many cases as possible using the app. Agents 5-9 and 11 work at 20% case capacity. Architect and Designer do planning only after cases complete — minimal tokens."
          elif [ "$HOUR" = "04" ]; then
            SESSION_TYPE="office_day_morning"
            TASK="Complete office Day 3 or start Day 4 in same pattern: max case resolution, app usage emphasis, light planning only."
          else
            SESSION_TYPE="maintenance"
            TASK="$NEXT_TASK"
          fi

          echo "SESSION_TYPE=$SESSION_TYPE" >> $GITHUB_OUTPUT
          echo "TASK=$TASK" >> $GITHUB_OUTPUT

      - name: Run Claude task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          SESSION_TYPE: ${{ steps.session.outputs.SESSION_TYPE }}
          TASK: ${{ steps.session.outputs.TASK }}
        run: |
          cat > run_claude.js << 'SCRIPT'
          const https = require('https');
          const fs = require('fs');

          const systemPrompt = `You are the autonomous maintainer of the
          data-center IT knowledge base and office simulation project.
          Work completely autonomously.
          ALWAYS start by reading: CLAUDE.md, TOKEN-BUDGET.md.
          ALWAYS run Hebrew/English RTL audit on index.html.
          Respect all rules in CLAUDE.md "Launch Decisions".
          Cost guards: $5 Claude API cap, use Groq for agents,
          Gemini for reports only. Output ONLY file changes as JSON:
          {"files":[{"path":"...","content":"..."}],
           "commit_message":"...","summary":"..."}`;

          const task = process.env.TASK || 'Read TOKEN-BUDGET.md and execute the next queued task.';

          const body = JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 4096,
            system: systemPrompt,
            messages: [{role: 'user', content:
              `Session type: ${process.env.SESSION_TYPE}\n` +
              `Task: ${task}\n\n` +
              `Current TOKEN-BUDGET.md:\n` +
              fs.readFileSync('TOKEN-BUDGET.md', 'utf8') + '\n\n' +
              `Current CLAUDE.md summary:\n` +
              fs.readFileSync('CLAUDE.md', 'utf8').slice(0, 3000)
            }]
          });

          const req = https.request({
            hostname: 'api.anthropic.com',
            path: '/v1/messages',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': process.env.ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01'
            }
          }, (res) => {
            let data = '';
            res.on('data', c => data += c);
            res.on('end', () => {
              try {
                const response = JSON.parse(data);
                const text = response.content[0].text;
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}') + 1;
                if (start === -1) {
                  fs.writeFileSync('claude_summary.txt', text);
                  console.log('No file changes — summary saved');
                  return;
                }
                const result = JSON.parse(text.slice(start, end));
                result.files.forEach(f => {
                  const dir = f.path.split('/').slice(0,-1).join('/');
                  if (dir) fs.mkdirSync(dir, {recursive: true});
                  fs.writeFileSync(f.path, f.content);
                  console.log('Written:', f.path);
                });
                fs.writeFileSync('claude_result.json', JSON.stringify({
                  commit_message: result.commit_message,
                  summary: result.summary
                }));
              } catch(e) {
                console.error('Parse error:', e.message);
                fs.writeFileSync('claude_error.txt', data);
              }
            });
          });
          req.on('error', e => { console.error(e); process.exit(1); });
          req.write(body);
          req.end();
          SCRIPT
          node run_claude.js

      - name: Commit changes
        run: |
          git config user.name 'claude-automation[bot]'
          git config user.email 'claude-automation@data-center'
          git add -A

          if [ -f claude_result.json ]; then
            MSG=$(node -e "console.log(require('./claude_result.json').commit_message)")
            SUMMARY=$(node -e "console.log(require('./claude_result.json').summary)")
          else
            MSG="chore: automated session $(date -u +%Y-%m-%d-%H%M)"
            SUMMARY="Session completed"
          fi

          git diff --cached --quiet || git commit -m "$MSG"
          git pull origin master --rebase
          git push origin master
          echo "✅ Committed: $MSG"
          echo "📋 Summary: $SUMMARY"

      - name: Update TOKEN-BUDGET.md session log
        run: |
          DATE=$(date -u +%Y-%m-%d\ %H:%M\ UTC)
          SESSION="${{ steps.session.outputs.SESSION_TYPE }}"
          echo "" >> TOKEN-BUDGET.md
          echo "- [$DATE] Auto-session: $SESSION — completed" >> TOKEN-BUDGET.md
          git add TOKEN-BUDGET.md
          git commit -m "chore: log auto-session [skip ci]" || true
          git push origin master || true
