name: Daily Link Check

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  link-check:
    name: Check source_url links
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run link check
        id: linkcheck
        run: node .github/scripts/check-links.js
        continue-on-error: true

      - name: Post summary to GitHub Actions
        if: always()
        run: node .github/scripts/check-links.js --summary >> $GITHUB_STEP_SUMMARY

      - name: Open GitHub Issue on broken links
        if: steps.linkcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-link',
            });
            if (issues.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Link Check] Broken source_url detected — ${date}`,
              body: [
                '## Daily Link Check Failed',
                '',
                `One or more \`source_url\` links are unreachable as of **${date}**.`,
                '',
                `**Workflow run:** [View details](${runUrl})`,
                '',
                '### How to fix:',
                '1. Run `node .github/scripts/check-links.js` locally to see which URLs failed',
                '2. Update the `source_url` field to a working link on an approved domain (see CLAUDE.md Rule 7)',
                '3. Run `node .github/scripts/validate-json.js` to confirm schema is valid',
                '4. Commit and push — this issue will be closed automatically when the next check passes',
                '',
                '---',
                '_Auto-opened by the daily link-check workflow._',
              ].join('\n'),
              labels: ['broken-link', 'automated'],
            });

      - name: Close issue if check passed
        if: steps.linkcheck.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-link',
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Resolved — all source URLs are reachable again.',
              });
            }
