# templates/project-brain-verify.yml — SPEC-4c, Route C. TEMPLATE.
#
# *** DO NOT PLACE THIS FILE IN aviv-brain's .github/workflows/. ***
# Copy it, together with automation/checks/project_verify.py and
# automation/checks/_lib.py, into the SOURCING PROJECT's own repository —
# e.g. notebook-x, data-center — as:
#     <project-repo>/.github/workflows/brain-verify.yml
#     <project-repo>/automation/brain_verify/project_verify.py
#     <project-repo>/automation/brain_verify/_lib.py
# and adjust the `--project` value below to that project's own name.
#
# SPEC-4c does not run in aviv-brain (SPEC-4c §0). This workflow runs on
# the SOURCING PROJECT's own CI, opens issues in the SOURCING PROJECT's own
# repository, and never writes to aviv-brain.
#
# REQUIRED SETUP, before this workflow will do anything but fail loudly:
#   1. A fine-grained, read-only GitHub PAT scoped to aviv-brain (it is
#      private; this workflow needs read access to clone it).
#   2. Add it to THIS project repo's Actions secrets as BRAIN_READ_TOKEN.
#   3. Adjust `project`, `brain-repo-url` and the schedule below.
# If step 1-2 has not been done, the job still fails loudly — but only AFTER
# project_verify.py itself runs and records why, per die_missing_secret().
# See the "Announce the token state" step below: it does NOT preflight-exit.
#
# SYNCED 2026-08-10, RUN K: brought the "Run project_verify.py" step up to
# the template's 2026-08-09 shape (set +e / captured exit code / GITHUB_STEP_
# SUMMARY / per-exit-code case block) — this repo's own "Announce the token
# state" fix (below) had never been ported back to the template; it now has
# been, in the same run. See triage/RECS-RUN-K-2026-08-10.md A8.

name: Brain pointer verification (SPEC-4c)

on:
  push:
    branches: [master]
    paths:
      # Re-run when the code a brain skill might point at changes. Adjust
      # to this project's actual layout — this is intentionally broad.
      - "**"
  schedule:
    - cron: "0 7 * * 1"   # weekly, offset an hour after aviv-brain's own weekly run
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Announce the token state (does NOT gate the run)
        # Deliberately does not exit here. project_verify.py itself records a
        # not-attempted Finding for a missing secret AND exits non-zero, so
        # the uploaded artifact explains why nothing was checked rather than
        # being empty. An empty artifact is indistinguishable from "checked,
        # found clean" -- the failure the not-attempted verdict exists to
        # prevent. Preflighting with `exit 78` here bypassed it entirely.
        run: |
          if [ -z "${{ secrets.BRAIN_READ_TOKEN }}" ]; then
            echo "::warning::BRAIN_READ_TOKEN is not set on this repository. project_verify.py will record every pointer as not-attempted and this job will then fail loudly. See this file's header for setup steps."
          fi

      - name: Diagnose the token BEFORE using it
        # ADDED 2026-08-08, after Route C's first runs with a token installed.
        # notebook-x and data-center both failed with git's generic
        # "Invalid username or token. Password authentication is not
        # supported for Git operations." That message cannot distinguish
        # expired / never-granted-this-repo / wrong-token-type / typo, and
        # `gh secret list` proves only that a NAME exists — it never shows a
        # value, so "the secret is set" was taken as "the secret works" for
        # a whole day. This step asks the API and prints the cause. It never
        # prints the token.
        env:
          T: ${{ secrets.BRAIN_READ_TOKEN }}
        run: |
          # NOTE: the emptiness test is HERE and not in a step-level `if:`.
          # `secrets` is not a valid context in `if:` -- GitHub rejects the
          # whole workflow file at parse time, the run shows 0s with no jobs,
          # and the only diagnostic is "this run likely failed because of a
          # workflow file issue". Found 2026-08-08 by pushing it. A local
          # `yaml.safe_load` parses it fine, which is exactly the class of
          # defect a self-test cannot see.
          if [ -z "$T" ]; then echo "BRAIN_READ_TOKEN empty; skipping probe"; exit 0; fi
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
            -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/avivnofar/aviv-brain)
          echo "GET /repos/avivnofar/aviv-brain -> HTTP $code"
          case "$code" in
            200) echo "Token authenticates and can see aviv-brain." ;;
            401) echo "::error::401 — the token is invalid, expired or revoked. Regenerate it and re-set BRAIN_READ_TOKEN in this repo." ;;
            403) echo "::error::403 — the token authenticates but is forbidden. A fine-grained PAT needs Repository access -> Only select repositories -> avivnofar/aviv-brain, and Repository permissions -> Contents: Read-only." ;;
            404) echo "::error::404 — the token authenticates but cannot see avivnofar/aviv-brain at all. It was almost certainly not granted access to this repository when it was created." ;;
            *)   echo "::error::HTTP $code — unexpected." ;;
          esac

      - name: Run project_verify.py
        env:
          BRAIN_READ_TOKEN: ${{ secrets.BRAIN_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # NO --sibling-repo FLAG, AND THAT IS THE POINT (2026-08-09, Run B §B4).
          # The set of repositories a project spans is read from the brain's
          # tracked automation/checks/project-sources.json (`repos`), which the
          # step above has just cloned to --brain-clone-dir. A project that is
          # not declared there FAILS CLOSED with a named error and exit 2 —
          # it does not quietly assume the project is one repository.
          python automation/brain_verify/project_verify.py \
            --project "data-center" \
            --project-root "${{ github.workspace }}" \
            --brain-clone-dir /tmp/aviv-brain \
            --brain-repo-url "https://github.com/avivnofar/aviv-brain.git" \
            --json-out pointer-findings.jsonl 2> verify-summary.txt
          rc=$?
          set -e
          cat verify-summary.txt
          {
            echo "### Route C — brain pointer verification"
            echo ""
            echo '```'
            cat verify-summary.txt
            echo "exit=$rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case $rc in
            0)  echo "::notice::clean — no findings, no check-errors." ;;
            1)  echo "::error::FINDINGS — at least one real defect in a brain pointer. See the artifact." ;;
            2)  echo "::error::CHECK-ERRORED — the checker could not answer. This is a fault in the CHECK, not a verdict on the library." ;;
            3)  echo "::error::FINDINGS **and** CHECK-ERRORS — both. Read the check-errors first; they bound what the findings mean." ;;
            78) echo "::error::NOT-ATTEMPTED — required secret missing. Nothing was verified. This is a setup gap, never a clean run." ;;
            *)  echo "::error::unexpected exit $rc" ;;
          esac
          exit $rc

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-pointer-verify-${{ github.run_id }}
          path: pointer-findings.jsonl
          retention-days: 30
